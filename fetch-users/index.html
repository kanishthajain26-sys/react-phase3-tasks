<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fetch Users</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>👥 Fetch Users</h1>
    <p class="subtitle">Explore users fetched from an API</p>

    <div class="controls">

      <input
        type="text"
        id="searchInput"
        placeholder="Search user by name..."
      >

      <button id="fetchBtn">Fetch Users</button>

    </div>

    <p id="loading"></p>

    <div id="errorBox" class="error-box">
      <p id="error"></p>
      <button id="retryBtn">Retry</button>
    </div>

    <p id="emptyMessage"></p>

    <div id="usersContainer" class="users-container"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
